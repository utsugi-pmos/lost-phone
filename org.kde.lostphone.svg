<?xml version="1.0" encoding="UTF-8"?>
<!-- A phone that is calling out: the handset plus the ring, and the pin that
     says the answer is a place. Drawn with currentColor so it follows the
     Breeze icon theme in both light and dark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- the phone -->
    <rect x="20" y="8" width="24" height="44" rx="4"/>
    <line x1="28" y1="14" x2="36" y2="14"/>
    <circle cx="32" cy="45" r="2" fill="currentColor" stroke="none"/>
    <!-- it is making noise: two arcs each side -->
    <path d="M 13 22 A 12 12 0 0 0 13 38" opacity="0.85"/>
    <path d="M 7 17 A 20 20 0 0 0 7 43" opacity="0.5"/>
    <path d="M 51 22 A 12 12 0 0 1 51 38" opacity="0.85"/>
    <path d="M 57 17 A 20 20 0 0 1 57 43" opacity="0.5"/>
  </g>
</svg>
